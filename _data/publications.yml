  title: "Active excitation through motion: Raptor-inspired attack separation control of airborne inertial stabilized platforms"
  venue: 2026 IEEE 20th International Conference on Control and Automation (ICCA), pp. 105–110
  venue_short: ICCA'26
  awards:
